name: Build and Release Helix

on:
  push:
    branches:
      - main  # Triggered when commits are pushed or merged into main

permissions:
  contents: write  # Allows the runner to create releases and upload assets

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # 1. Clone the repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Setup MSVC compiler
      - name: Install MSVC Compiler
        uses: microsoft/setup-msbuild@v2

      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 4. Cache Qt
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: D:\a\Helix\Qt
          key: ${{ runner.os }}-qt-6.8.3-msvc2022-graphs-multimedia-quick3d-qt5compat-v2

      # 5. Install Qt
      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          python -m pip install --upgrade aqtinstall
          $qtInstallPath = "D:\a\Helix\Qt"
          echo "Attempting to install Qt via dotsrc mirror..."
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir $qtInstallPath --modules qtgraphs qtmultimedia qtquick3d qtshadertools qtquicktimeline qt5compat --base https://mirrors.dotsrc.org/qtproject
          if ($LASTEXITCODE -ne 0) {
            echo "Dotsrc mirror failed, attempting constant mirror..."
            python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir $qtInstallPath --modules qtgraphs qtmultimedia qtquick3d qtshadertools qtquicktimeline qt5compat --base https://qt.mirror.constant.com
            if ($LASTEXITCODE -ne 0) {
              echo "Constant mirror failed, attempting fallback to default redirection..."
              python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir $qtInstallPath --modules qtgraphs qtmultimedia qtquick3d qtshadertools qtquicktimeline qt5compat
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            }
          }

      # 6. Configure Qt Environment
      - name: Configure Qt Environment
        shell: powershell
        run: |
          $qtInstallPath = "D:\a\Helix\Qt"
          $qtBinPath = "$qtInstallPath\6.8.3\msvc2022_64\bin"
          echo "$qtBinPath" >> $env:GITHUB_PATH
          echo "QT_PATH=$qtInstallPath\6.8.3\msvc2022_64" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$qtInstallPath\6.8.3\msvc2022_64" >> $env:GITHUB_ENV

      # 7. Setup Inno Setup
      - name: Setup Inno Setup
        run: choco install innosetup -y

      # 8. Configure with CMake
      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      # 9. Build the Helix.exe binary
      - name: Build Application
        run: |
          cmake --build build --config Release

      # 10. Prepare the deployment distribution
      - name: Prepare dist directory
        shell: powershell
        run: |
          mkdir dist
          # Copy Helix.exe
          copy build\Release\Helix.exe dist\Helix.exe
          # Copy portable PostgreSQL DLLs
          copy resources\dlls\* dist\

      # 11. Deploy Qt dependencies
      - name: Run windeployqt
        run: |
          windeployqt --qmldir qml dist\Helix.exe

      # 12. Build the installer using Inno Setup
      - name: Compile Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      # 13. Extract the version from version.json
      - name: Extract Version Info
        id: get_version
        shell: powershell
        run: |
          $version = (Get-Content version.json | ConvertFrom-Json).latest_version
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # 14. Create a GitHub release and upload the installer
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Helix Release v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            Helix_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
