name: Build and Release Helix (macOS Apple Silicon)

on:
  push:
    branches:
      - main  # Triggered when commits are pushed or merged into main

permissions:
  contents: write  # Allows the runner to create releases and upload assets

jobs:
  build-and-release-macos:
    runs-on: macos-14  # macos-14 uses Apple Silicon (M1/M2) runners by default

    steps:
      # 1. Clone the repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Setup Python (for aqtinstall)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Install Homebrew Dependencies
      # We need libpq for PostgreSQL database connection. QXlsx and Crypto (if QCryptographicHash) are built-in or compile from source.
      - name: Install System Dependencies
        run: |
          brew install libpq
          brew link --force libpq

      # 4. Cache Qt
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/Qt
          key: ${{ runner.os }}-qt-6.8.3-mac-graphs-multimedia-quick3d-qt5compat

      # 5. Install Qt for macOS
      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade aqtinstall
          python -m aqt install-qt mac desktop 6.8.3 clang_64 --outputdir ${{ runner.workspace }}/Qt --modules qtgraphs qtmultimedia qtquick3d qtshadertools qtquicktimeline qt5compat

      # 6. Configure Qt Environment
      - name: Configure Qt Environment
        run: |
          echo "QT_PATH=${{ runner.workspace }}/Qt/6.8.3/macos" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=${{ runner.workspace }}/Qt/6.8.3/macos" >> $GITHUB_ENV
          echo "${{ runner.workspace }}/Qt/6.8.3/macos/bin" >> $GITHUB_PATH

      # 7. Configure with CMake
      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      # 8. Build the Helix.app bundle
      - name: Build Application
        run: |
          cmake --build build --config Release

      # 9. Deploy Qt dependencies and fix code signature
      - name: Deploy and Sign
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install dylibbundler
          
          # macdeployqt bundles the Qt libraries, QML modules, and SQL drivers
          macdeployqt build/Helix.app -qmldir=qml -always-overwrite
          
          # Remove unused plugins that reference nonexistent libraries (like ODBC / iODBC)
          rm -f build/Helix.app/Contents/PlugIns/sqldrivers/libqsqlodbc.dylib
          
          # Point libqsqlpsql.dylib to the Homebrew libpq installation if needed
          LIBPQ_PATH="$(brew --prefix libpq)/lib/libpq.5.dylib"
          if [ -f "build/Helix.app/Contents/PlugIns/sqldrivers/libqsqlpsql.dylib" ]; then
            chmod +w build/Helix.app/Contents/PlugIns/sqldrivers/libqsqlpsql.dylib
            OLD_LIBPQ=$(otool -L build/Helix.app/Contents/PlugIns/sqldrivers/libqsqlpsql.dylib | grep -E 'libpq\.[0-9]+\.dylib' | awk '{print $1}' || true)
            if [ -n "$OLD_LIBPQ" ] && [ "$OLD_LIBPQ" != "$LIBPQ_PATH" ]; then
              echo "Fixing libqsqlpsql libpq link from $OLD_LIBPQ to $LIBPQ_PATH"
              install_name_tool -change "$OLD_LIBPQ" "$LIBPQ_PATH" build/Helix.app/Contents/PlugIns/sqldrivers/libqsqlpsql.dylib
            fi
            
            # Bundle libpq and its dependencies (libssl, libcrypto, etc.) into Frameworks
            # Note: Do NOT use -od (overwrite-dir) as it would wipe out Qt frameworks!
            dylibbundler -b -of -x build/Helix.app/Contents/PlugIns/sqldrivers/libqsqlpsql.dylib \
              -d build/Helix.app/Contents/Frameworks/ \
              -p @executable_path/../Frameworks/ \
              -s "$(brew --prefix libpq)/lib" \
              -s "$(brew --prefix openssl@3)/lib" \
              -s /opt/homebrew/lib < /dev/null
          fi
          
          # macdeployqt breaks the original ad-hoc signature by adding libraries. 
          # We must re-sign the entire bundle ad-hoc to prevent the macOS "damaged" error.
          codesign --force --deep --sign - build/Helix.app
          
          # Create the DMG manually after signing
          hdiutil create -volname "Helix" -srcfolder build/Helix.app -ov -format UDZO build/Helix.dmg

      # 10. Extract the version from version.json
      - name: Extract Version Info
        id: get_version
        run: |
          # Parse version using jq
          VERSION=$(jq -r '.latest_version' version.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 11. Upload the DMG to the GitHub release
      # This step attaches the macOS installer to the same release created by your Windows workflow
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          files: |
            build/Helix.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
