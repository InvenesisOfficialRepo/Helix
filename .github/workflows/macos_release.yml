name: Build and Release Helix (macOS Apple Silicon)

on:
  push:
    branches:
      - main  # Triggered when commits are pushed or merged into main

permissions:
  contents: write  # Allows the runner to create releases and upload assets

jobs:
  build-and-release-macos:
    runs-on: macos-14  # macos-14 uses Apple Silicon (M1/M2) runners by default

    steps:
      # 1. Clone the repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Setup Python (for aqtinstall)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Install Homebrew Dependencies
      # We need libpq for PostgreSQL database connection. QXlsx and Crypto (if QCryptographicHash) are built-in or compile from source.
      - name: Install System Dependencies
        run: |
          brew install libpq
          brew link --force libpq

      # 4. Cache Qt
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/Qt
          key: ${{ runner.os }}-qt-6.8.3-mac-graphs-multimedia-quick3d-qt5compat

      # 5. Install Qt for macOS
      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade aqtinstall
          python -m aqt install-qt mac desktop 6.8.3 clang_64 --outputdir ${{ runner.workspace }}/Qt --modules qtgraphs qtmultimedia qtquick3d qtshadertools qtquicktimeline qt5compat

      # 6. Configure Qt Environment
      - name: Configure Qt Environment
        run: |
          echo "QT_PATH=${{ runner.workspace }}/Qt/6.8.3/macos" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=${{ runner.workspace }}/Qt/6.8.3/macos" >> $GITHUB_ENV
          echo "${{ runner.workspace }}/Qt/6.8.3/macos/bin" >> $GITHUB_PATH

      # 7. Configure with CMake
      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      # 8. Build the Helix.app bundle
      - name: Build Application
        run: |
          cmake --build build --config Release

      # 9. Deploy Qt dependencies and fix code signature
      - name: Deploy and Sign
        run: |
          # 1. Run macdeployqt to bundle Qt frameworks, QML modules, and plugins
          macdeployqt build/Helix.app -qmldir=qml -always-overwrite
          
          # 2. Clean up unused database plugins
          rm -f build/Helix.app/Contents/PlugIns/sqldrivers/libqsqlodbc.dylib
          rm -f build/Helix.app/Contents/PlugIns/sqldrivers/libqsqlmimer.dylib
          
          # 3. Bundle libpq and all its Homebrew dependencies into Contents/Frameworks
          FRAMEWORKS_DIR="build/Helix.app/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS_DIR"
          
          LIBPQ_SOURCE="$(brew --prefix libpq)/lib/libpq.5.dylib"
          echo "Copying libpq from $LIBPQ_SOURCE to $FRAMEWORKS_DIR"
          cp -L "$LIBPQ_SOURCE" "$FRAMEWORKS_DIR/libpq.5.dylib"
          chmod 755 "$FRAMEWORKS_DIR/libpq.5.dylib"
          install_name_tool -id "@rpath/libpq.5.dylib" "$FRAMEWORKS_DIR/libpq.5.dylib"
          
          # Helper function to recursively find and bundle all Homebrew dependencies
          bundle_deps() {
            local file="$1"
            for dep in $(otool -L "$file" | awk '{print $1}' | grep -E '^(/opt/homebrew|/usr/local)' | sort -u); do
              local dep_name=$(basename "$dep")
              if [ ! -f "$FRAMEWORKS_DIR/$dep_name" ]; then
                echo "Bundling dependency: $dep -> $FRAMEWORKS_DIR/$dep_name"
                cp -L "$dep" "$FRAMEWORKS_DIR/$dep_name"
                chmod 755 "$FRAMEWORKS_DIR/$dep_name"
                install_name_tool -id "@rpath/$dep_name" "$FRAMEWORKS_DIR/$dep_name" 2>/dev/null || true
                bundle_deps "$FRAMEWORKS_DIR/$dep_name"
              fi
              install_name_tool -change "$dep" "@rpath/$dep_name" "$file" 2>/dev/null || true
            done
          }
          
          bundle_deps "$FRAMEWORKS_DIR/libpq.5.dylib"
          
          # Fix internal cross-references among all bundled dylibs in Frameworks
          for dylib in "$FRAMEWORKS_DIR"/*.dylib; do
            [ -f "$dylib" ] || continue
            for dep in $(otool -L "$dylib" | awk '{print $1}' | grep -E '^(/opt/homebrew|/usr/local)' | sort -u); do
              local dep_name=$(basename "$dep")
              install_name_tool -change "$dep" "@rpath/$dep_name" "$dylib" 2>/dev/null || true
            done
          done
          
          # 4. Rewire Qt PostgreSQL driver (libqsqlpsql.dylib)
          PSQL_PLUGIN="build/Helix.app/Contents/PlugIns/sqldrivers/libqsqlpsql.dylib"
          if [ -f "$PSQL_PLUGIN" ]; then
            chmod +w "$PSQL_PLUGIN"
            install_name_tool -add_rpath "@loader_path/../../Frameworks" "$PSQL_PLUGIN" 2>/dev/null || true
            install_name_tool -add_rpath "@executable_path/../Frameworks" "$PSQL_PLUGIN" 2>/dev/null || true
            
            for old_pq in $(otool -L "$PSQL_PLUGIN" | awk '{print $1}' | grep -E 'libpq' | sort -u); do
              echo "Rewiring $PSQL_PLUGIN dependency: $old_pq -> @rpath/libpq.5.dylib"
              install_name_tool -change "$old_pq" "@rpath/libpq.5.dylib" "$PSQL_PLUGIN" 2>/dev/null || true
            done
          fi
          
          # 5. Ensure main executable has Frameworks in rpath
          install_name_tool -add_rpath "@executable_path/../Frameworks" build/Helix.app/Contents/MacOS/Helix 2>/dev/null || true
          
          # 6. Re-sign all individual binaries and the complete app bundle
          find build/Helix.app/Contents/Frameworks -name "*.dylib" -exec codesign --force --sign - {} \;
          find build/Helix.app/Contents/Frameworks -name "*.framework" -exec codesign --force --sign - {} \;
          find build/Helix.app/Contents/PlugIns -name "*.dylib" -exec codesign --force --sign - {} \;
          codesign --force --deep --sign - build/Helix.app
          
          # Verify the bundle signature and dependencies
          codesign --verify --deep --strict --verbose=2 build/Helix.app
          if [ -f "$PSQL_PLUGIN" ]; then
            echo "Final dependencies for libqsqlpsql.dylib:"
            otool -L "$PSQL_PLUGIN"
          fi
          
          # 7. Create the DMG manually after signing
          hdiutil create -volname "Helix" -srcfolder build/Helix.app -ov -format UDZO build/Helix.dmg

      # 10. Extract the version from version.json
      - name: Extract Version Info
        id: get_version
        run: |
          # Parse version using jq
          VERSION=$(jq -r '.latest_version' version.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 11. Upload the DMG to the GitHub release
      # This step attaches the macOS installer to the same release created by your Windows workflow
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          files: |
            build/Helix.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
